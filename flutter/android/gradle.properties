org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin's incremental compiler cache can't relativize paths across two
# different drive letters (e.g. project on D:, pub cache on C:), and fails
# with "this and base files have different roots" on Windows in that case.
kotlin.incremental=false
