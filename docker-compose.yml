services:
  tamashelf:
    build: .
    container_name: tamashelf
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      # Base de données locale (persistante)
      - ./data:/data
      # Monter les disques entiers pour pouvoir ajouter des bibliothèques depuis l'admin
      - /mnt/14To:/mnt/14To:ro
      - /mnt/8To:/mnt/8To:ro
      # Depuis que app.py est le seul process à écrire dans nautiljon_mangas.db (voir
      # NAUTILJON_DB/APP_PY_* ci-dessous), TamaShelf n'a plus besoin d'un accès en
      # écriture à ce dossier -- il ne fait plus que lire les jaquettes déjà
      # téléchargées sur disque (/api/nautiljon/img). :ro suffit désormais, et retire
      # un chemin d'écriture directe de plus vers ce fichier partagé.
      - /mnt/14To/nautiljon:/mnt/14To/nautiljon:ro
    environment:
      - TAMASHELF_DATA=/data
      - TAMASHELF_STATIC=/app/static
      # Sert uniquement à retrouver le dossier des images (nautiljon_dir()) -- plus
      # aucun accès SQLite direct depuis ce conteneur, voir APP_PY_* ci-dessous.
      - NAUTILJON_DB=/mnt/14To/nautiljon/nautiljon_mangas.db
      # Adresse où app.py écoute (le process qui, seul désormais, ouvre
      # nautiljon_mangas.db) -- remplace-la par l'IP réelle du Pi si app.py ne tourne
      # pas dans ce même conteneur/hôte au sens Docker (cas normal : app.py tourne en
      # dehors de Docker, directement sur le Pi).
      #
      # ⚠️ IMPORTANT -- à CHANGER obligatoirement, ce ne sont PAS des identifiants
      # valides par défaut : app.py exige désormais ses propres identifiants admin via
      # les variables d'environnement TAMAJON_ADMIN_USER / TAMAJON_ADMIN_PASS côté
      # tamajon.py (il refuse de démarrer si elles ne sont pas définies -- plus aucun
      # identifiant codé en dur dans le code). APP_PY_USER/APP_PY_PASS ci-dessous
      # doivent correspondre EXACTEMENT à ce que tu as choisi là-bas.
      - APP_PY_URL=http://192.168.1.XXX:5555
      - APP_PY_USER=change-moi
      - APP_PY_PASS=change-moi-aussi
