<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: plan plein écran (calque quadrillé) + panneau de propriétés à droite, bottom sheet sur téléphone */
:root {
  --bg: #E7EBE8;
  --paper: #F6F8F5;
  --panel: #FFFFFF;
  --ink: #1C2528;
  --muted: #5D6A6D;
  --line: #CBD3D0;
  --grid-minor: rgba(28, 37, 40, .055);
  --grid-major: rgba(28, 37, 40, .14);
  --accent: #2F5DA8;
  --accent-soft: rgba(47, 93, 168, .12);
  --sel: #D2452B;
  --danger: #B8322A;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111719; --paper: #162024; --panel: #1B2529; --ink: #E4EBE9; --muted: #92A2A4;
    --line: #2C393D; --grid-minor: rgba(228, 235, 233, .05); --grid-major: rgba(228, 235, 233, .12);
    --accent: #84A9EC; --accent-soft: rgba(132, 169, 236, .16); --sel: #FF7A57; --danger: #FF7B70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111719; --paper: #162024; --panel: #1B2529; --ink: #E4EBE9; --muted: #92A2A4;
  --line: #2C393D; --grid-minor: rgba(228, 235, 233, .05); --grid-major: rgba(228, 235, 233, .12);
  --accent: #84A9EC; --accent-soft: rgba(132, 169, 236, .16); --sel: #FF7A57; --danger: #FF7B70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.4;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Barre du haut ---------- */
.top {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: thin; position: relative; z-index: 5;
}
.brand { font-weight: 800; font-stretch: 118%; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { display: block; font-family: var(--font-num); font-weight: 400; font-stretch: 100%; font-size: 10px; color: var(--muted); letter-spacing: .04em; }
.sep { width: 1px; align-self: stretch; background: var(--line); flex: none; }
.group { display: flex; align-items: center; gap: 4px; flex: none; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--paper);
  white-space: nowrap; font-weight: 500;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { border-color: var(--line); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }

.levels { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); flex: none; }
.levels button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; white-space: nowrap; color: var(--muted); font-weight: 600; }
.levels button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

details.menu { position: relative; flex: none; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
.dropdown {
  position: fixed; z-index: 50; min-width: 230px; max-height: 70vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.dropdown button, .dropdown label.row {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px;
  border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer;
}
.dropdown button:hover, .dropdown label.row:hover { background: var(--accent-soft); }
.dropdown .dim { font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.dropdown hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.dropdown .title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 10px 2px; }

.status { font-family: var(--font-num); font-size: 11px; color: var(--muted); white-space: nowrap; margin-left: auto; }

/* ---------- Zone principale ---------- */
main { display: flex; min-height: 0; }
.stage {
  position: relative; flex: 1; min-width: 0; overflow: hidden; background-color: var(--paper);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#plan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#plan.panning { cursor: grabbing; }
#plan text { font-family: var(--font-ui); pointer-events: none; }
#plan .num { font-family: var(--font-num); }
#world * { vector-effect: non-scaling-stroke; }
.it { cursor: move; }
.st-ink { stroke: var(--ink); }
.st-muted { stroke: var(--muted); }
.fill-paper { fill: var(--paper); }
.lbl { fill: var(--ink); stroke: var(--paper); paint-order: stroke; stroke-linejoin: round; }
.lbl-muted { fill: var(--muted); stroke: var(--paper); paint-order: stroke; stroke-linejoin: round; }
.sel-line { stroke: var(--sel); fill: none; }
.sel-handle { fill: var(--panel); stroke: var(--sel); }
.sel-txt { fill: var(--sel); stroke: var(--paper); paint-order: stroke; }
.ghost-shape { fill: none; stroke: var(--muted); stroke-dasharray: 6 5; opacity: .55; }

.scalebar {
  position: absolute; left: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 3px;
  font-family: var(--font-num); font-size: 11px; color: var(--muted); pointer-events: none;
}
.scalebar i { display: block; height: 6px; border: 1.5px solid var(--ink); border-top: 0; }
.zoombox { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
.zoombox .btn { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.hint {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px;
  font-size: 12px; color: var(--muted); box-shadow: 0 2px 8px rgba(0,0,0,.08); text-align: center;
}

/* ---------- Panneau ---------- */
aside {
  width: 330px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; display: flex; flex-direction: column;
}
.sheet-grip { display: none; }
.pane { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.pane h2 { margin: 0; font-size: 18px; font-weight: 750; font-stretch: 112%; text-wrap: balance; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.section { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 11px; color: var(--muted); }
.field input, .field textarea, .field select {
  width: 100%; min-width: 0; height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--paper);
}
.field textarea { height: 70px; padding: 6px 8px; resize: vertical; }
.unit { position: relative; }
.unit input { padding-right: 30px; font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; }
.unit::after { content: attr(data-u); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }
input.name { height: 38px; font-size: 16px; font-weight: 650; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px;
  background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; align-self: flex-start;
}
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.swatches input[type=color] { width: 30px; height: 30px; padding: 0; border: 0; background: none; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }

.photo-drop {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 120px; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--paper);
  color: var(--muted); font-size: 12px; text-align: center; padding: 12px; cursor: pointer;
}
.photo-drop.over { border-color: var(--accent); background: var(--accent-soft); }
.photo-drop img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 6px; display: block; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }

.list { display: flex; flex-direction: column; gap: 2px; }
.list button {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; text-align: left;
  border: 0; background: none; padding: 6px 8px; border-radius: 6px; min-width: 0;
}
.list button:hover { background: var(--accent-soft); }
.list .thumb { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background-size: cover; background-position: center; }
.list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.list .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.list .dm { font-family: var(--font-num); font-size: 11px; color: var(--muted); white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; }
.note { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.note b { color: var(--ink); }
kbd { font-family: var(--font-num); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--paper); }

/* ---------- Dialogues ---------- */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; max-width: min(92vw, 900px); }
dialog::backdrop { background: rgba(10, 15, 17, .55); }
.dlg { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.dlg h3 { margin: 0; font-size: 17px; font-stretch: 110%; }
.dlg p { margin: 0; color: var(--muted); }
.dlg .actions { justify-content: flex-end; }
#lightbox img { display: block; max-width: 100%; max-height: 72vh; margin: 0 auto; border-radius: 8px; }

/* ---------- Téléphone ---------- */
/* ---------- Vue 3D ---------- */
.v3d { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; }
.v3d canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.v3d-stage { position: relative; flex: 1; min-height: 0; }
.v3d-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.v3d-bar .where { font-family: var(--font-num); font-size: 12px; color: var(--muted); margin-right: auto; }
.v3d-help {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px;
  font-size: 12px; color: var(--muted); text-align: center; pointer-events: none;
}
.joy { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid var(--accent); background: var(--accent-soft); pointer-events: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--accent); opacity: .8; }
.card3d {
  position: absolute; right: 16px; top: 16px; width: min(280px, calc(100% - 32px)); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.card3d img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; background: var(--paper); }
.card3d b { font-size: 15px; }
.card3d .facts { font-size: 11px; }
.v3d-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 16px; text-align: center; }

@media (max-width: 760px) {
  main { flex-direction: column; }
  .top { flex-wrap: wrap; overflow-x: visible; row-gap: 6px; padding-block: 8px; }
  .top .sep { display: none; }
  .status { display: none; }
  aside {
    width: auto; height: 44%; border-left: 0; border-top: 1px solid var(--line);
    box-shadow: 0 -6px 18px rgba(0,0,0,.08); transition: height .2s;
  }
  aside.collapsed { height: 44px; overflow: hidden; }
  .sheet-grip {
    display: flex; align-items: center; justify-content: center; gap: 8px; flex: none; height: 44px;
    border: 0; border-bottom: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; position: sticky; top: 0; z-index: 1;
  }
  .sheet-grip::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
  .brand small { display: none; }
  .hint { display: none; }
  .btn .lbl-txt { display: none; }
  .btn.has-lbl { width: 32px; padding: 0; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Plan de maison<small>cotes en cm · 1 carreau = 10 cm</small></div>
  <div class="sep"></div>
  <div class="levels" id="levels" role="group" aria-label="Niveaux"></div>
  <button class="btn icon ghost" id="addLevel" title="Ajouter un niveau" aria-label="Ajouter un niveau">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg>
  </button>
  <div class="sep"></div>
  <div class="group">
    <button class="btn has-lbl" data-add="room" title="Ajouter une pièce">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="12" height="12"/></svg><span class="lbl-txt">Pièce</span></button>
    <button class="btn has-lbl" data-add="stairs" title="Ajouter un escalier">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="1.5" width="8" height="13"/><path d="M4 4.5h8M4 7.5h8M4 10.5h8"/></svg><span class="lbl-txt">Escalier</span></button>
    <button class="btn has-lbl" data-add="door" title="Ajouter une porte">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 13V3M3 3a10 10 0 0 1 10 10M1 13h14"/></svg><span class="lbl-txt">Porte</span></button>
    <button class="btn has-lbl" data-add="window" title="Ajouter une fenêtre">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="6" width="13" height="4"/><path d="M1.5 8h13"/></svg><span class="lbl-txt">Fenêtre</span></button>
    <details class="menu" id="furnMenu">
      <summary class="btn primary has-lbl" title="Ajouter un meuble">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 7h12v5H2zM4 12v2M12 12v2M3 7V4h10v3"/></svg><span class="lbl-txt">Meuble ▾</span></summary>
      <div class="dropdown" id="furnList"></div>
    </details>
    <button class="btn has-lbl" id="open3d" title="Voir en 3D et se promener">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5zM2 5l6 3.5L14 5M8 8.5v6"/></svg><span class="lbl-txt">3D</span></button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn icon ghost" id="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3 2 6l3 3M2 6h8a4 4 0 0 1 0 8H7"/></svg></button>
    <button class="btn icon ghost" id="redo" title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m11 3 3 3-3 3M14 6H6a4 4 0 0 0 0 8h3"/></svg></button>
    <details class="menu" id="mainMenu">
      <summary class="btn has-lbl" title="Options et fichier">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg><span class="lbl-txt">Options</span></summary>
      <div class="dropdown">
        <div class="title">Aimantation</div>
        <label class="row" for="snapSel">Pas de la grille
          <select id="snapSel">
            <option value="0">libre</option><option value="1">1 cm</option><option value="5" selected>5 cm</option>
            <option value="10">10 cm</option><option value="25">25 cm</option><option value="50">50 cm</option>
          </select>
        </label>
        <label class="row" for="optCarry">Une pièce déplace son contenu <input type="checkbox" id="optCarry" checked></label>
        <label class="row" for="optGhost">Voir le niveau du dessous <input type="checkbox" id="optGhost" checked></label>
        <label class="row" for="optDims">Cotes des meubles sur le plan <input type="checkbox" id="optDims"></label>
        <hr>
        <div class="title">Fichier</div>
        <button id="exportBtn">Exporter le plan (.json)</button>
        <button id="importBtn">Importer un plan…</button>
        <button id="sampleBtn">Recharger le plan d'exemple…</button>
        <button id="newBtn" class="danger">Nouveau plan vide…</button>
      </div>
    </details>
  </div>
  <span class="status" id="status">—</span>
</header>

<main>
  <div class="stage" id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg" aria-label="Plan">
      <g id="world">
        <g id="ghost"></g>
        <g id="items"></g>
        <g id="labels"></g>
        <g id="selection"></g>
      </g>
    </svg>
    <div class="hint" id="hint">Glissez pour déplacer · poignées pour redimensionner · molette ou pincer pour zoomer</div>
    <div class="scalebar"><span id="scaleTxt">1 m</span><i id="scaleBar" style="width:60px"></i></div>
    <div class="zoombox">
      <button class="btn icon" id="zoomIn" aria-label="Zoomer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg></button>
      <button class="btn icon" id="zoomOut" aria-label="Dézoomer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10"/></svg></button>
      <button class="btn icon" id="zoomFit" aria-label="Tout afficher" title="Tout afficher"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    </div>
  </div>
  <aside id="aside">
    <button class="sheet-grip" id="grip" aria-label="Afficher ou masquer le panneau"></button>
    <div class="pane" id="pane"></div>
  </aside>
</main>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<div class="v3d" id="v3d" hidden>
  <div class="v3d-bar">
    <div class="levels" role="group" aria-label="Mode 3D">
      <button id="m3Over" aria-pressed="true">Vue d'ensemble</button>
      <button id="m3Walk" aria-pressed="false">Se promener</button>
    </div>
    <span class="where" id="v3Where"></span>
    <button class="btn" id="v3Close">Revenir au plan</button>
  </div>
  <div class="v3d-stage" id="v3Stage">
    <div class="v3d-msg" id="v3Msg">Chargement de la 3D…</div>
    <div class="joy" id="joy" hidden><i></i></div>
    <div class="card3d" id="card3d" hidden></div>
    <div class="v3d-help" id="v3Help"></div>
  </div>
</div>

<dialog id="lightbox">
  <div class="dlg">
    <h3 id="lbTitle"></h3>
    <img id="lbImg" alt="">
    <div class="actions"><button class="btn" data-close>Fermer</button></div>
  </div>
</dialog>
<dialog id="confirmDlg">
  <form class="dlg" method="dialog">
    <h3 id="cfTitle"></h3>

// contour d'une pièce dans son repère local (origine au coin haut-gauche) ; rectangle si pas de points
const roomPts = it => (it.type === 'room' && it.pts && it.pts.length >= 3) ? it.pts : [{ x: 0, y: 0 }, { x: it.w, y: 0 }, { x: it.w, y: it.d }, { x: 0, y: it.d }];
function polyArea(p) {
  let a = 0;
  for (let i = 0; i < p.length; i++) { const j = (i + 1) % p.length; a += p[i].x * p[j].y - p[j].x * p[i].y; }
  return Math.abs(a) / 2;
}

  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {

function localToWorld(it, p) {

  return { x: c.x + dx * Math.cos(a) - dy * Math.sin(a), y: c.y + dx * Math.sin(a) + dy * Math.cos(a) };
}

// la pièce contient-elle ce point du plan ?
function roomHas(r, x, y) {

  return r.type === 'room' && r.pts ? inPoly(r.pts, l.x, l.y) : l.x >= 0 && l.x <= r.w && l.y >= 0 && l.y <= r.d;
}
// redéfinit le contour d'une pièce à partir de coins exprimés sur le plan (la rotation est conservée)
function setRoomWorld(it, W) {
  const a = it.rot * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
  const q = W.map(p => ({ x: p.x * co + p.y * si, y: -p.x * si + p.y * co }));
  const xs = q.map(p => p.x), ys = q.map(p => p.y);

const SHAPES = {

let doc = null;

/* =========================================================
   Sauvegarde (IndexedDB, dans ce navigateur)
   ========================================================= */
let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('plan-maison', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbP;
}
async function dbGet(k) {
  const d = await db();
  return new Promise((res, rej) => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function dbSet(k, v) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
let saveTimer = 0;

/* =========================================================
   DOM

function $(s) { return document.querySelector(s); }
const svg = $('#plan'), world = $('#world'), stage = $('#stage');
const gItems = $('#items'), gLabels = $('#labels'), gSel = $('#selection'), gGhost = $('#ghost');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* =========================================================
   Rendu du plan
   ========================================================= */
function applyView() {
  world.setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.s})`);
  const maj = 100 * view.s, min = 10 * view.s;
  const layers = [`linear-gradient(var(--grid-major) 1px, transparent 1px)`, `linear-gradient(90deg, var(--grid-major) 1px, transparent 1px)`];
  const sizes = [`${maj}px ${maj}px`, `${maj}px ${maj}px`];
  if (min >= 5) {
    layers.push(`linear-gradient(var(--grid-minor) 1px, transparent 1px)`, `linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px)`);
    sizes.push(`${min}px ${min}px`, `${min}px ${min}px`);
  }
  stage.style.backgroundImage = layers.join(',');
  stage.style.backgroundSize = sizes.join(',');
  const pos = `${view.tx}px ${view.ty}px`;
  stage.style.backgroundPosition = layers.map(() => pos).join(',');
  // échelle graphique : longueur "ronde" proche de 80 px
  const cands = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000];
  const len = cands.find(c => c * view.s >= 60) || 5000;
  $('#scaleBar').style.width = (len * view.s) + 'px';
  $('#scaleTxt').textContent = len >= 100 ? `${fmt(len / 100, len % 100 ? 1 : 0)} m` : `${len} cm`;
}

const nodes = new Map();
function sortedItems() {
  return items().map((it, i) => [it, i]).sort((a, b) => (TYPES[a[0].type].layer - TYPES[b[0].type].layer) || (a[1] - b[1])).map(p => p[0]);
}
function itemTransform(it) { return `translate(${it.x} ${it.y}) rotate(${it.rot} ${it.w / 2} ${it.d / 2})`; }

function baseSVG(it) {
  const { w, d } = it;
  switch (it.type) {
    case 'room':
      return it.pts
        ? `<polygon points="${it.pts.map(p => p.x + ',' + p.y).join(' ')}" style="fill:${it.color};fill-opacity:.32" class="st-ink" stroke-width="3" stroke-linejoin="miter"/>`
        : `<rect width="${w}" height="${d}" style="fill:${it.color};fill-opacity:.32" class="st-ink" stroke-width="3"/>`;
    case 'stairs': {
      const n = it.steps || Math.max(2, Math.round(d / 18));
      let s = `<rect width="${w}" height="${d}" style="fill:${it.color};fill-opacity:.4" class="st-ink" stroke-width="1.5"/>`;
      for (let i = 1; i < n; i++) { const y = d * i / n; s += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" class="st-ink" stroke-width=".8"/>`; }
      return s;
    }
    case 'door': {
      const h2 = w / 2;
      const leaf = it.double
        ? `M0 0 L0 ${-h2} A${h2} ${h2} 0 0 1 ${h2} 0 M${w} 0 L${w} ${-h2} A${h2} ${h2} 0 0 0 ${h2} 0`
        : it.flip ? `M${w} 0 L${w} ${-w} M${w} ${-w} A${w} ${w} 0 0 0 0 0` : `M0 0 L0 ${-w} M0 ${-w} A${w} ${w} 0 0 1 ${w} 0`;
      return `<rect width="${w}" height="${d}" class="fill-paper st-ink" stroke-width="1"/>`
        + `<path d="${leaf}" fill="none" class="st-ink" stroke-width="1.2" stroke-dasharray="0"/>`
        + `<rect x="0" y="${-w}" width="${w}" height="${w}" fill="transparent"/>`;
    }
    case 'window':
      return `<rect width="${w}" height="${d}" style="fill:${it.color};fill-opacity:.55" class="st-ink" stroke-width="1.2"/>`
        + `<line x1="0" y1="${d / 2}" x2="${w}" y2="${d / 2}" class="st-ink" stroke-width=".8"/>`;
    default: {
      const ph = it.photo && it.showPhoto;
      return `<rect width="${w}" height="${d}" style="fill:${it.color};fill-opacity:${ph ? 1 : .6}"/>`;
    }
  }
}
function topSVG(it) {
  const { w, d } = it;
  if (it.type === 'furniture') return `<rect width="${w}" height="${d}" fill="none" class="st-ink" stroke-width="1.5"/>`
    + `<line x1="0" y1="${d}" x2="${w}" y2="${d}" class="st-ink" stroke-width="4"/>`; // face avant (porte la photo en 3D)
  if (it.type === 'stairs') {
    // flèche de montée
    const cx = w / 2, a = it.reverse ? d - 12 : 12, b = it.reverse ? 14 : d - 14, hd = Math.min(18, w / 3);
    const dir = it.reverse ? 1 : -1;
    return `<path d="M${cx} ${b} L${cx} ${a} M${cx - hd / 1.6} ${a - dir * hd} L${cx} ${a} L${cx + hd / 1.6} ${a - dir * hd}" fill="none" class="st-ink" stroke-width="1.6"/>`
      + `<circle cx="${cx}" cy="${b}" r="${Math.min(5, w / 10)}" style="fill:var(--ink)"/>`;
  }
  return '';
}

function renderItems() {
  const list = sortedItems();
  const seen = new Set();
  list.forEach((it, i) => {
    seen.add(it.id);
    let n = nodes.get(it.id);
    if (!n) {
      const g = el('g', { class: 'it', 'data-id': it.id });
      const clip = el('clipPath', { id: 'c-' + it.id }); const cr = el('rect'); clip.appendChild(cr);
      const base = el('g'); const img = el('image', { preserveAspectRatio: 'xMidYMid slice', 'clip-path': `url(#c-${it.id})` });
      const top = el('g');
      g.append(clip, base, img, top);
      n = { g, cr, base, img, top, photo: undefined };
      nodes.set(it.id, n);
    }
    n.g.setAttribute('transform', itemTransform(it));
    n.cr.setAttribute('width', it.w); n.cr.setAttribute('height', it.d);
    n.base.innerHTML = baseSVG(it);
    n.top.innerHTML = topSVG(it);
    const showImg = it.type === 'furniture' && it.photo && it.showPhoto;
    if (showImg) {
      if (n.photo !== it.photo) { n.img.setAttribute('href', it.photo); n.photo = it.photo; }
      n.img.setAttribute('width', it.w); n.img.setAttribute('height', it.d);
      n.img.removeAttribute('display');
    } else n.img.setAttribute('display', 'none');
    if (gItems.children[i] !== n.g) gItems.insertBefore(n.g, gItems.children[i] || null);
  });
  for (const [id, n] of nodes) if (!seen.has(id)) { n.g.remove(); nodes.delete(id); }
}

function center(it) {
  return { x: it.x + it.w / 2, y: it.y + it.d / 2 };
}
function renderLabels() {
  const s = view.s, px = v => v / s;
  let out = '';
  for (const it of sortedItems()) {
    const c = center(it);
    const big = Math.min(it.w, it.d) * s;
    if (it.type === 'room') {
      if (big < 30) continue;
      // nom dans le coin haut-gauche de la pièce, pour laisser le centre aux meubles
      const k = worldPts(it).reduce((a, b) => (b.y + b.x * .2 < a.y + a.x * .2 ? b : a));
      const lx = k.x + px(8), ly = k.y + px(20);
      out += `<text x="${lx}" y="${ly}" class="lbl" stroke-width="3" font-size="${px(14)}" font-weight="700">${esc(it.name)}</text>`;
      if (Math.min(it.w, it.d) * s >= 130) out += `<text x="${lx}" y="${ly + px(15)}" class="lbl-muted num" stroke-width="3" font-size="${px(11)}">${fmt(m2(it), 1)} m²${it.pts ? '' : ` · ${fmt(it.w)}×${fmt(it.d)}`}</text>`;
    } else if (it.type === 'furniture') {
      if (big < 14 && it.id !== selId) continue;
      const fs = clamp(Math.min(it.w, it.d) * s / 4, 9, 12);
      const yy = it.photo && it.showPhoto ? c.y + Math.max(Math.abs(it.w * Math.sin(it.rot * Math.PI / 180)) , Math.abs(it.d * Math.cos(it.rot * Math.PI / 180))) / 2 + px(fs + 3) : c.y + px(fs / 3);
      out += `<text x="${c.x}" y="${yy}" text-anchor="middle" class="lbl" stroke-width="3" font-size="${px(fs)}" font-weight="600">${esc(it.name)}</text>`;
      if (opts.dims) out += `<text x="${c.x}" y="${yy + px(fs + 1)}" text-anchor="middle" class="lbl-muted num" stroke-width="3" font-size="${px(fs - 1)}">${fmt(it.w)}×${fmt(it.d)}×${fmt(it.h)}</text>`;
    } else if (it.type === 'stairs') {
      if (big < 30) continue;
      const n = it.steps || Math.max(2, Math.round(it.d / 18));
      out += `<text x="${c.x}" y="${c.y}" text-anchor="middle" class="lbl-muted num" stroke-width="3" font-size="${px(10)}">${n} m.</text>`;
    }
  }
  gLabels.innerHTML = out;
}

function renderSelection() {
  const it = selected();
  if (!it) { gSel.innerHTML = ''; return; }
  const s = view.s, px = v => v / s, hs = px(10);
  const { w, d } = it;
  let h = `<g transform="${itemTransform(it)}">`;
  h += `<rect x="${-px(3)}" y="${-px(3)}" width="${w + px(6)}" height="${d + px(6)}" class="sel-line" stroke-width="1.5" stroke-dasharray="5 4"/>`;

  if (!(it.type === 'room' && it.pts)) {
    h += `<text x="${w / 2}" y="${-px(10)}" text-anchor="middle" class="sel-txt num" stroke-width="3" font-size="${px(11)}" font-weight="600">${fmt(w)} cm</text>`;
    h += `<text transform="translate(${w + px(12)} ${d / 2}) rotate(90)" text-anchor="middle" class="sel-txt num" stroke-width="3" font-size="${px(11)}" font-weight="600">${fmt(d)} cm</text>`;
  }
  // poignée de rotation
  h += `<line x1="${w / 2}" y1="${-px(3)}" x2="${w / 2}" y2="${-px(32)}" class="sel-line" stroke-width="1"/>`;
  h += `<circle cx="${w / 2}" cy="${-px(36)}" r="${px(7)}" class="sel-handle" stroke-width="1.5" data-h="rot" style="cursor:grab"/>`;
  const cur = { '-1,-1': 'nwse', '1,1': 'nwse', '1,-1': 'nesw', '-1,1': 'nesw', '0,-1': 'ns', '0,1': 'ns', '-1,0': 'ew', '1,0': 'ew' };
  for (const hx of [-1, 0, 1]) for (const hy of [-1, 0, 1]) {
    if (!hx && !hy) continue;
    if ((it.type === 'door' || it.type === 'window') && hy) continue; // épaisseur fixe à la main
    const x = (hx + 1) / 2 * w, y = (hy + 1) / 2 * d;
    h += `<rect x="${x - hs / 2}" y="${y - hs / 2}" width="${hs}" height="${hs}" class="sel-handle" stroke-width="1.5" data-h="${hx},${hy}" style="cursor:${cur[hx + ',' + hy]}-resize"/>`;
  }
  if (it.type === 'room') {
    // coins déplaçables, "+" au milieu de chaque mur pour ajouter un coin, longueur de chaque mur
    const P = roomPts(it), n = P.length;
    P.forEach((a, i) => {
      const b = P[(i + 1) % n], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, len = Math.hypot(b.x - a.x, b.y - a.y);
      let nx = -(b.y - a.y) / (len || 1), ny = (b.x - a.x) / (len || 1);
      if (inPoly(P, mx + nx * 2, my + ny * 2)) { nx = -nx; ny = -ny; } // vers l'extérieur
      if (it.pts) h += `<text x="${mx + nx * px(14)}" y="${my + ny * px(14) + px(4)}" text-anchor="middle" class="sel-txt num" stroke-width="3" font-size="${px(11)}" font-weight="600">${fmt(len)}</text>`;
      if (len * s > 40) h += `<g data-h="a,${i}" style="cursor:copy"><circle cx="${mx}" cy="${my}" r="${px(8)}" class="sel-handle" stroke-width="1"/><path d="M${mx - px(4)} ${my}h${px(8)}M${mx} ${my - px(4)}v${px(8)}" class="sel-line" stroke-width="1.5"/></g>`;
    });
    P.forEach((a, i) => {
      h += `<circle cx="${a.x}" cy="${a.y}" r="${px(i === selVertex ? 8 : 6)}" class="sel-handle" stroke-width="${i === selVertex ? 3 : 2}" data-h="v,${i}" style="cursor:move${i === selVertex ? ';fill:var(--sel)' : ''}"/>`;
    });
  }
  h += '</g>';
  gSel.innerHTML = h;
}

function renderGhost() {
  const idx = doc.levels.indexOf(level());
  const below = idx > 0 ? doc.levels[idx - 1] : null;
  if (!opts.ghost || !below) { gGhost.innerHTML = ''; return; }
  gGhost.innerHTML = below.items.filter(i => i.type === 'room' || i.type === 'stairs')
    .map(it => `<polygon transform="${itemTransform(it)}" points="${roomPts(it).map(p => p.x + ',' + p.y).join(' ')}" class="ghost-shape" stroke-width="1.2"/>`).join('');
}

function renderLevels() {
  const box = $('#levels');
  box.innerHTML = doc.levels.map(l => `<button data-level="${l.id}" aria-pressed="${l.id === doc.cur}">${esc(l.name)}</button>`).join('');
}

function renderPlan() { applyView(); renderItems(); renderLabels(); renderSelection(); }

/* =========================================================
   Panneau
   ========================================================= */
function thumbStyle(it) {
  if (it.photo) return `background-image:url('${it.photo}')`;
  return `background:${it.color}`;
}
function renderPanel() {
  const pane = $('#pane');

  $('#grip').textContent = it ? `${TYPES[it.type].label} · ${it.name}` : level().name;
  // garde le champ en cours de saisie quand le panneau est redessiné

function levelPanel() {
  const lv = level();
  const rooms = lv.items.filter(i => i.type === 'room');

  const groups = [['room', 'Pièces'], ['stairs', 'Escaliers'], ['furniture', 'Meubles'], ['door', 'Portes'], ['window', 'Fenêtres']];
  let h = '';
  if (doc.sample) h += `<div class="note"><b>Plan d'exemple.</b> Modifiez-le librement, ou repartez d'une feuille blanche avec <b>Options › Nouveau plan vide</b>.</div>`;

    </div></div>`;
  for (const [t, title] of groups) {

    h += list.map(i => `<button data-pick="${i.id}"><span class="thumb" style="${esc(thumbStyle(i))}"></span>

      <span class="dm">${fmt(i.w)}×${fmt(i.d)}</span></button>`).join('');
    h += `</div></div>`;

  h += `<div class="note">Touchez un élément pour le régler. Le bouton <b>3D</b> permet de visiter la maison. Le trait épais d'un meuble marque sa face avant, qui porte la photo en 3D. Raccourcis : <kbd>Suppr</kbd> effacer, <kbd>Ctrl</kbd>+<kbd>D</kbd> dupliquer, <kbd>R</kbd> pivoter de 90°, flèches pour décaler (<kbd>Maj</kbd> ×10).</div>`;

function num(k, label, val, unit = 'cm', step = 1) {

}
function itemPanel(it) {

      </div>

      ${it.type === 'furniture' ? `<label class="toggle"><input type="checkbox" data-k="showPhoto" ${it.showPhoto ? 'checked' : ''}> Afficher la photo sur le plan</label>` : ''}` : ''}

  </div>`;

    h += `<div class="facts"><span>Surface <b>${fmt(m2(it), 2)} m²</b></span><span>Volume <b>${fmt(m2(it) * it.h / 100, 1)} m³</b></span></div>`;
    const shape = it.pts ? '' : 'rect';
    h += `</div><div class="section"><span class="eyebrow">Forme</span>
      <div class="actions">
        <button class="btn" data-shape="rect" aria-pressed="${shape === 'rect'}">Rectangle</button>
        <button class="btn" data-shape="L">En L</button><button class="btn" data-shape="T">En T</button><button class="btn" data-shape="U">En U</button>
      </div>
      <p class="empty" style="margin:0;font-size:12px">Sur le plan, tirez un <b>rond</b> pour déplacer un coin, ou un <b>+</b> au milieu d'un mur pour ajouter un coin.</p>`;
    if (it.pts) {
      const P = it.pts;
      h += `<div class="grid3">${P.map((a, i) => { const b = P[(i + 1) % P.length];
        return `<label class="field"><span>Mur ${i + 1}</span><span class="unit" data-u="cm"><input type="number" inputmode="decimal" step="1" data-edge="${i}" id="f-edge-${i}" value="${Math.round(Math.hypot(b.x - a.x, b.y - a.y))}"></span></label>`; }).join('')}</div>`;
      if (selVertex !== null && P.length > 3) h += `<button class="btn danger" data-act="delVertex">Supprimer le coin sélectionné</button>`;
    }
  }
  if (it.type === 'stairs') {
    const n = it.steps || Math.max(2, Math.round(it.d / 18));

      <button class="btn" data-act="reverse">Inverser le sens de montée</button>`;
  }
  if (it.type === 'door') h += `<div class="actions"><button class="btn" data-act="double">${it.double ? 'Porte simple' : 'Porte double (placard)'}</button>${it.double ? '' : '<button class="btn" data-act="flip">Changer le côté des gonds</button>'}</div>`;

  h += `<div class="section"><span class="eyebrow">Position</span><div class="grid3">
    ${num('x', 'X', it.x)}${num('y', 'Y', it.y)}${num('rot', 'Rotation', it.rot, '°', 1)}
  </div></div>`;

  h += `<div class="section"><span class="eyebrow">Couleur</span><div class="swatches">${sw}<input type="color" data-k="color" id="f-color" value="${it.color}" aria-label="Couleur personnalisée"></div></div>`;
  h += `<label class="field"><span>Notes (marque, prix, lien…)</span><textarea data-k="notes" id="f-notes">${esc(it.notes)}</textarea></label>`;
  h += `<div class="actions">
    <button class="btn" data-act="rot90">Pivoter 90°</button>
    <button class="btn" data-act="dup">Dupliquer</button>
    <button class="btn" data-act="front">Devant</button>
    <button class="btn" data-act="back">Derrière</button>
    ${doc.levels.length > 1 ? `<select class="btn" data-act-select="moveLevel" aria-label="Déplacer vers un autre niveau"><option value="">Vers un niveau…</option>${doc.levels.filter(l => l !== level()).map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select>` : ''}
    <button class="btn danger" data-act="del">Supprimer</button>
  </div>
  <button class="btn ghost" data-act="deselect">← Retour au niveau</button>`;
  return h;
}

function syncPanel() {
  const it = selected(); if (!it) return;
  if (it.type === 'room' && it.pts) it.pts.forEach((a, i) => {
    const inp = document.getElementById('f-edge-' + i), b = it.pts[(i + 1) % it.pts.length];
    if (inp && document.activeElement !== inp) inp.value = Math.round(Math.hypot(b.x - a.x, b.y - a.y));
  });
  for (const k of ['x', 'y', 'w', 'd', 'rot']) {
    const inp = document.getElementById('f-' + k);
    if (inp && document.activeElement !== inp) inp.value = Math.round(it[k] * 10) / 10;
  }
}

/* =========================================================
   Actions
   ========================================================= */
function changed(full) {
  if (full) { renderLevels(); renderGhost(); renderPanel(); }
  renderPlan();
  updateUndoButtons();
  scheduleSave();
}
function viewCenterWorld() {
  const r = svg.getBoundingClientRect();
  return { x: (r.width / 2 - view.tx) / view.s, y: (r.height / 2 - view.ty) / view.s };
}
function addItem(type, over = {}) {
  pushHistory();
  const it = makeItem(type, over);
  const c = viewCenterWorld();
  it.x = snapv(c.x - it.w / 2); it.y = snapv(c.y - it.d / 2);
  if (type === 'room') it.color = SWATCHES.room[level().items.filter(i => i.type === 'room').length % SWATCHES.room.length];
  if (type === 'room') it.name = 'Pièce ' + (level().items.filter(i => i.type === 'room').length + 1);
  items().push(it);
  selId = it.id;
  changed(true);
  openSheet();
}
function delSel() {
  const it = selected(); if (!it) return;
  pushHistory();
  level().items = items().filter(i => i !== it);
  selId = null; changed(true);
}
function dupSel() {
  const it = selected(); if (!it) return;
  pushHistory();
  const c = Object.assign({}, it, { id: uid(), x: it.x + 20, y: it.y + 20 });
  items().push(c); selId = c.id; changed(true);
}
function rotSel(deg) {
  const it = selected(); if (!it) return;
  pushHistory(); it.rot = ((it.rot + deg) % 360 + 360) % 360; changed(true);
}
function nudge(dx, dy) {
  const it = selected(); if (!it) return;
  pushHistory();
  for (const m of movers(it)) { m.x += dx; m.y += dy; }
  changed(false); syncPanel();
}
function delVertex() {
  const it = selected();
  if (!it || it.type !== 'room' || selVertex === null || roomPts(it).length <= 3) return false;
  pushHistory();
  const W = worldPts(it); W.splice(selVertex, 1); setRoomWorld(it, W);
  selVertex = null; changed(true); return true;
}
function select(id) { selId = id; selVertex = null; renderPanel(); renderPlan(); }

// éléments qui suivent une pièce déplacée
function inside(room, it) {
  const c = center(it);
  return roomHas(room, c.x, c.y);
}
function movers(it) {
  if (it.type !== 'room' || !opts.carry) return [it];
  return [it, ...items().filter(o => o.type !== 'room' && o.type !== 'door' && o.type !== 'window' && inside(it, o))];
}

/* =========================================================
   Photos
   ========================================================= */
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Ce fichier n\'est pas une image.'));
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Image illisible.'));
      img.onload = () => {
        const max = 1200, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function setPhoto(file) {
  const it = selected(); if (!it) return;
  try {
    const url = await readImage(file);
    pushHistory(); it.photo = url; it.showPhoto = true; changed(true);
  } catch (e) { setStatus(e.message); }
}
function openLightbox(it) {
  if (!it || !it.photo) return;
  $('#lbTitle').textContent = `${it.name} · ${fmt(it.w)} × ${fmt(it.d)}${it.type !== 'room' ? ' × ' + fmt(it.h) : ''} cm`;
  $('#lbImg').src = it.photo; $('#lbImg').alt = it.name;
  $('#lightbox').showModal();
}

/* =========================================================
   Confirmation (dans la page)
   ========================================================= */
function confirmBox(title, text, okLabel) {
  return new Promise(res => {
    const d = $('#confirmDlg');
    $('#cfTitle').textContent = title; $('#cfText').textContent = text; $('#cfOk').textContent = okLabel;
    d.returnValue = '';
    d.addEventListener('close', () => res(d.returnValue === 'ok'), { once: true });
    d.showModal();
  });
}

/* =========================================================
   Vue : zoom / ajustement
   ========================================================= */
function zoomAt(f, sx, sy) {
  const ns = clamp(view.s * f, 0.04, 10);
  const wx = (sx - view.tx) / view.s, wy = (sy - view.ty) / view.s;
  view.s = ns; view.tx = sx - wx * ns; view.ty = sy - wy * ns;
  renderPlan();
}
function corners(it) {
  const c = center(it), a = it.rot * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([u, v]) => {
    const x = u * it.w / 2, y = v * it.d / 2;
    return { x: c.x + x * co - y * si, y: c.y + x * si + y * co };
  });
}
function fit() {
  const r = svg.getBoundingClientRect();
  const pts = items().flatMap(corners);
  if (!pts.length || !r.width) { view.s = 0.7; view.tx = r.width / 2; view.ty = r.height / 2; renderPlan(); return; }
  const minx = Math.min(...pts.map(p => p.x)), maxx = Math.max(...pts.map(p => p.x));
  const miny = Math.min(...pts.map(p => p.y)), maxy = Math.max(...pts.map(p => p.y));
  const pad = 50;
  view.s = clamp(Math.min((r.width - pad * 2) / Math.max(50, maxx - minx), (r.height - pad * 2) / Math.max(50, maxy - miny)), 0.04, 4);
  view.tx = (r.width - (maxx - minx) * view.s) / 2 - minx * view.s;
  view.ty = (r.height - (maxy - miny) * view.s) / 2 - miny * view.s;
  renderPlan();
}

/* =========================================================
   Gestes (souris, doigt, stylet)
   ========================================================= */
const ptrs = new Map();
let g = null; // geste en cours

function toLocal(e) { const r = svg.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function toWorld(p) { return { x: (p.x - view.tx) / view.s, y: (p.y - view.ty) / view.s }; }

svg.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  svg.setPointerCapture(e.pointerId);
  const p = toLocal(e);
  ptrs.set(e.pointerId, p);
  $('#hint').hidden = true;
  closeMenus();

  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    g = { mode: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, s0: view.s, tx0: view.tx, ty0: view.ty };
    return;
  }
  if (ptrs.size > 2) return;

  const w = toWorld(p);
  const handle = e.target.closest && e.target.closest('[data-h]');
  const target = e.target.closest && e.target.closest('[data-id]');
  const it = selected();
  if (handle && it) {
    const hv = handle.getAttribute('data-h');
    if (hv === 'rot') g = { mode: 'rotate', it, rot0: it.rot };
    else if (hv[0] === 'v' || hv[0] === 'a') {
      let i = +hv.split(',')[1];
      if (hv[0] === 'a') { // nouveau coin au milieu du mur, aussitôt déplaçable
        pushHistory();
        const W = worldPts(it), a = W[i], b = W[(i + 1) % W.length];
        W.splice(i + 1, 0, { x: r1((a.x + b.x) / 2), y: r1((a.y + b.y) / 2) });
        setRoomWorld(it, W); i++;
        renderItems(); renderLabels();
      }
      selVertex = i; renderSelection();
      g = { mode: 'vertex', it, i, W: worldPts(it), pushed: hv[0] === 'a' };
    }
    else { const [hx, hy] = hv.split(',').map(Number); g = { mode: 'resize', it, hx, hy, o: { x: it.x, y: it.y, w: it.w, d: it.d, pts: it.pts && it.pts.map(p => ({ ...p })) } }; }
  } else if (target) {
    const id = target.getAttribute('data-id');
    if (id !== selId) { selId = id; selVertex = null; renderPanel(); renderSelection(); }
    const t = findItem(id);
    g = { mode: 'move', it: t, list: movers(t).map(m => ({ m, x: m.x, y: m.y })) };
  } else {
    g = { mode: 'pan', tx0: view.tx, ty0: view.ty, tap: true };
    svg.classList.add('panning');
  }
  g.p0 = p; g.w0 = w; g.dirty = false;
});

svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !g) return;
  const p = toLocal(e);
  ptrs.set(e.pointerId, p);
  if (g.mode === 'pinch') {
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const ns = clamp(g.s0 * d / (g.d0 || 1), 0.04, 10);
    const wx = (g.m0.x - g.tx0) / g.s0, wy = (g.m0.y - g.ty0) / g.s0;
    view.s = ns; view.tx = m.x - wx * ns; view.ty = m.y - wy * ns;
    renderPlan(); return;
  }
  const dxs = p.x - g.p0.x, dys = p.y - g.p0.y;
  if (!g.dirty && Math.hypot(dxs, dys) < 3) return;
  const w = toWorld(p), dx = w.x - g.w0.x, dy = w.y - g.w0.y;

  if (g.mode === 'pan') { g.tap = false; view.tx = g.tx0 + dxs; view.ty = g.ty0 + dys; applyView(); return; }

  if (!g.dirty) { if (!g.pushed) pushHistory(); g.dirty = true; }
  const it = g.it;
  if (g.mode === 'move') {
    const first = g.list[0];
    const nx = snapv(first.x + dx), ny = snapv(first.y + dy);
    const ddx = nx - first.x, ddy = ny - first.y;
    for (const o of g.list) { o.m.x = o.x + ddx; o.m.y = o.y + ddy; }
  } else if (g.mode === 'resize') {
    const a = it.rot * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
    const lx = dx * co + dy * si, ly = -dx * si + dy * co; // delta dans le repère de l'objet
    const o = g.o, min = 5;
    let nw = o.w, nd = o.d, sx = 0, sy = 0;
    if (g.hx) { nw = Math.max(min, snapv(o.w + g.hx * lx)); sx = g.hx * (nw - o.w) / 2; }
    if (g.hy) { nd = Math.max(min, snapv(o.d + g.hy * ly)); sy = g.hy * (nd - o.d) / 2; }
    const cx = o.x + o.w / 2 + sx * co - sy * si, cy = o.y + o.d / 2 + sx * si + sy * co;
    it.w = nw; it.d = nd; it.x = Math.round((cx - nw / 2) * 10) / 10; it.y = Math.round((cy - nd / 2) * 10) / 10;
    if (o.pts) it.pts = o.pts.map(p => ({ x: r1(p.x * nw / o.w), y: r1(p.y * nd / o.d) }));
  } else if (g.mode === 'vertex') {
    const W = g.W.map(p => ({ ...p })), n = W.length;
    const a = it.rot * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
    const toL = p => ({ x: p.x * co + p.y * si, y: -p.x * si + p.y * co }), toW = q => ({ x: q.x * co - q.y * si, y: q.x * si + q.y * co });
    const q = toL({ x: snapv(g.W[g.i].x + dx), y: snapv(g.W[g.i].y + dy) }), tol = 8 / view.s;
    // s'aligne sur les coins voisins pour garder des murs droits
    for (const j of [g.i - 1, g.i + 1]) {
      const nb = toL(g.W[(j + n) % n]);
      if (Math.abs(q.x - nb.x) < tol) q.x = nb.x;
      if (Math.abs(q.y - nb.y) < tol) q.y = nb.y;
    }
    W[g.i] = toW(q);
    setRoomWorld(it, W);
  } else if (g.mode === 'rotate') {
    const c = center(it);
    let ang = Math.atan2(w.y - c.y, w.x - c.x) * 180 / Math.PI + 90;
    if (!e.shiftKey) ang = Math.round(ang / 15) * 15;
    it.rot = ((Math.round(ang) % 360) + 360) % 360;
  }
  renderItems(); renderLabels(); renderSelection(); syncPanel();
});

function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  svg.classList.remove('panning');
  if (!g) return;
  if (g.mode === 'pinch') { if (ptrs.size === 0) g = null; return; }
  if (g.mode === 'pan' && g.tap && selId) { selId = null; selVertex = null; renderPanel(); renderSelection(); }
  if (g.mode === 'vertex') changed(true);
  else if (g.dirty) { changed(false); if (g.it && g.it.type === 'room') renderPanel(); }
  else if (g.mode === 'move' && e.pointerType !== 'mouse') openSheet();
  g = null;
}

  const t = e.target;
  if (t.id === 'lvName') {
    if (editPushed !== t) { pushHistory(); editPushed = t; }
    level().name = t.value || 'Niveau'; renderLevels(); $('#grip').textContent = level().name; scheduleSave(); return;
  }
  if (t.dataset.edge !== undefined) {
    const it = selected(), v = parseFloat(t.value); if (!it || !it.pts || !(v > 0)) return;
    if (editPushed !== t) { pushHistory(); editPushed = t; }
    // allonge le mur : le coin suivant et celui d'après glissent dans le même sens
    const W = worldPts(it), n = W.length, i = +t.dataset.edge, a = W[i], b = W[(i + 1) % n];
    const len = Math.hypot(b.x - a.x, b.y - a.y) || 1, ux = (b.x - a.x) / len, uy = (b.y - a.y) / len, dl = v - len;
    for (const j of new Set([(i + 1) % n, (i + 2) % n])) if (j !== i) { W[j].x += ux * dl; W[j].y += uy * dl; }
    setRoomWorld(it, W);
    renderItems(); renderLabels(); renderSelection(); syncPanel(); scheduleSave(); updateUndoButtons();
    return;
  }
  const k = t.dataset.k; const it = selected(); if (!k || !it) return;

  if (t.type === 'number') { v = parseFloat(v); if (!isFinite(v)) return; }
  if (['w', 'd', 'h'].includes(k)) v = Math.max(1, v);
  if (k === 'steps') v = clamp(Math.round(v), 2, 60);
  if (k === 'rot') v = ((v % 360) + 360) % 360;
  if (editPushed !== t) { pushHistory(); editPushed = t; }
  if (it.type === 'room' && it.pts && (k === 'w' || k === 'd')) { const f = v / it[k]; it.pts.forEach(p => { p[k === 'w' ? 'x' : 'y'] = r1(p[k === 'w' ? 'x' : 'y'] * f); }); }
  it[k] = v;
  if (k === 'name') $('#grip').textContent = `${TYPES[it.type].label} · ${it.name}`;
  if (k === 'color') pane.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', s.dataset.color.toLowerCase() === v.toLowerCase()));

/* =========================================================
   Vue 3D : vue d'ensemble (maison de poupée) et promenade
   ========================================================= */
const THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
const ORBIT_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
const WALL_T = 8;        // épaisseur d'un demi-mur (cm), chaque pièce a ses propres murs
const EYE = 160;         // hauteur des yeux (cm)
const RADIUS = 22;       // "épaisseur" du promeneur pour les collisions
const DOOR_TOP_DEFAULT = 204, WINDOW_TOP = 215;

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}
let threeReady = null;
function ensureThree() {
  if (!threeReady) threeReady = (window.THREE ? Promise.resolve() : loadScript(THREE_URL))
    .then(() => THREE.OrbitControls ? null : loadScript(ORBIT_URL))
    .catch(e => { threeReady = null; throw e; });
  return threeReady;
}

// point du plan -> repère local d'un élément (origine au coin haut-gauche)
function toItemLocal(it, x, y) {
  const c = center(it), a = -it.rot * Math.PI / 180;
  const dx = x - c.x, dy = y - c.y;
  return { x: dx * Math.cos(a) - dy * Math.sin(a) + it.w / 2, y: dx * Math.sin(a) + dy * Math.cos(a) + it.d / 2 };
}
function inRect(it, x, y, m = 0) {
  if (it.type === 'room' && it.pts) return roomHas(it, x, y);
  const l = toItemLocal(it, x, y);
  return l.x >= -m && l.x <= it.w + m && l.y >= -m && l.y <= it.d + m;
}
// avancement (0 en bas, 1 en haut) sur un escalier, ou null si hors de l'escalier
function stairProgress(st, x, y) {
  const l = toItemLocal(st, x, y);
  if (l.x < 0 || l.x > st.w || l.y < 0 || l.y > st.d) return null;
  return clamp(st.reverse ? l.y / st.d : (st.d - l.y) / st.d, 0, 1);
}

// altitude de chaque niveau ; un escalier posé au-dessus d'un escalier du niveau inférieur n'est que la trémie
function houseLayout() {
  const L = doc.levels, stairs = [], elev = [0];
  L.forEach((lv, i) => {
    const below = i > 0 ? stairs[i - 1] : [];
    stairs[i] = lv.items.filter(it => it.type === 'stairs' && !below.some(b => inside(b, it) || inside(it, b)));
    const rooms = lv.items.filter(it => it.type === 'room');
    const hgt = stairs[i].length ? Math.max(...stairs[i].map(s => s.h)) : (rooms.length ? Math.max(...rooms.map(r => r.h)) : 250) + 20;
    elev[i + 1] = elev[i] + hgt;
  });
  return { stairs, elev };
}

const v3 = {
  open: false, mode: 'over', renderer: null, scene: null, cam: null, orbit: null, raf: 0, last: 0,
  levelGroups: [], pick: [], blockers: [], layout: null,
  walk: { x: 0, z: 0, yaw: 0, pitch: 0, lv: 0, y: 0 }, keys: new Set(),
  joy: null, look: null, down: null,
};

function srgb(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
function mixHex(hex, to, k) {
  const a = new THREE.Color(hex), b = new THREE.Color(to);
  return '#' + a.lerp(b, k).getHexString();
}
function mat(hex, extra = {}) { return new THREE.MeshStandardMaterial(Object.assign({ color: srgb(hex), roughness: .85, metalness: 0 }, extra)); }

// place un objet au point (lx, ly) du repère local d'un élément
function placeLocal(obj, it, lx, ly, y) {
  const c = center(it), a = it.rot * Math.PI / 180;
  const dx = lx - it.w / 2, dy = ly - it.d / 2;
  obj.position.set(c.x + dx * Math.cos(a) - dy * Math.sin(a), y, c.y + dx * Math.sin(a) + dy * Math.cos(a));
  obj.rotation.y = -a;
}

function buildScene() {
  const scene = new THREE.Scene();
  const css = getComputedStyle(document.documentElement);
  scene.background = srgb(css.getPropertyValue('--bg').trim() || '#E7EBE8');
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8577, .75));
  const sun = new THREE.DirectionalLight(0xffffff, .65);
  scene.add(sun, sun.target);

  const layout = houseLayout();
  v3.layout = layout; v3.levelGroups = []; v3.pick = []; v3.blockers = [];
  const texCache = new Map();
  const tex = url => {
    if (!texCache.has(url)) { const t = new THREE.TextureLoader().load(url); t.encoding = THREE.sRGBEncoding; texCache.set(url, t); }
    return texCache.get(url);
  };
  const wallMat = mat('#EFEBE4'), edgeMat = new THREE.LineBasicMaterial({ color: srgb('#2a3236'), transparent: true, opacity: .35 });
  const glassMat = new THREE.MeshStandardMaterial({ color: srgb('#9fd0ec'), transparent: true, opacity: .3, roughness: .1, side: THREE.DoubleSide });
  const box = (w, h, d, m) => { const me = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, .1), Math.max(h, .1), Math.max(d, .1)), m); me.castShadow = me.receiveShadow = true; return me; };
  const withEdges = me => { const e = new THREE.LineSegments(new THREE.EdgesGeometry(me.geometry), edgeMat); me.add(e); return me; };

  let minx = Infinity, maxx = -Infinity, minz = Infinity, maxz = -Infinity;

  doc.levels.forEach((lv, li) => {
    const grp = new THREE.Group(); grp.userData.li = li;
    const y0 = layout.elev[li];
    const blockers = [];
    const rooms = lv.items.filter(i => i.type === 'room');
    const openings = lv.items.filter(i => i.type === 'door' || i.type === 'window');
    const wells = li > 0 ? layout.stairs[li - 1] : [];

    for (const it of lv.items) for (const p of corners(it)) { minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); minz = Math.min(minz, p.y); maxz = Math.max(maxz, p.y); }

    for (const r of rooms) {
      // sol, découpé autour des trémies d'escalier du niveau inférieur
      const P = roomPts(r);
      const xs = new Set(P.map(p => p.x)), ys = new Set(P.map(p => p.y)), holes = [];
      for (const st of wells) {
        const pts = corners(st).map(p => toItemLocal(r, p.x, p.y));
        const h = { x0: clamp(Math.min(...pts.map(p => p.x)), 0, r.w), x1: clamp(Math.max(...pts.map(p => p.x)), 0, r.w),
                    y0: clamp(Math.min(...pts.map(p => p.y)), 0, r.d), y1: clamp(Math.max(...pts.map(p => p.y)), 0, r.d) };
        if (h.x1 - h.x0 > 1 && h.y1 - h.y0 > 1) { holes.push(h); xs.add(h.x0); xs.add(h.x1); ys.add(h.y0); ys.add(h.y1); }
      }
      const X = [...xs].sort((a, b) => a - b), Y = [...ys].sort((a, b) => a - b);
      const floorMat = mat(mixHex(r.color, '#ffffff', .45), { side: THREE.DoubleSide });
      if (!holes.length) { // sol d'un seul tenant, à la forme exacte de la pièce
        const shp = new THREE.Shape(P.map(p => new THREE.Vector2(p.x, -p.y)));
        const fl = new THREE.Mesh(new THREE.ShapeGeometry(shp), floorMat);
        fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true;
        const holder = new THREE.Group(); holder.add(fl);
        placeLocal(holder, r, 0, 0, y0 + .5);
        grp.add(holder);
      } else for (let i = 0; i < X.length - 1; i++) for (let j = 0; j < Y.length - 1; j++) {
        const cx = (X[i] + X[i + 1]) / 2, cy = (Y[j] + Y[j + 1]) / 2;
        if (!inPoly(P, cx, cy) || holes.some(h => cx > h.x0 && cx < h.x1 && cy > h.y0 && cy < h.y1)) continue;
        const pl = new THREE.Mesh(new THREE.PlaneGeometry(X[i + 1] - X[i], Y[j + 1] - Y[j]), floorMat);
        pl.rotation.x = -Math.PI / 2; pl.receiveShadow = true;
        const holder = new THREE.Group(); holder.add(pl);
        placeLocal(holder, r, cx, cy, y0 + .5);
        grp.add(holder);
      }

      // murs, avec les ouvertures des portes et fenêtres posées dessus
      // s'il y a un étage, les murs montent jusqu'à son plancher
      const C = worldPts(r), H = doc.levels[li + 1] ? Math.max(r.h, layout.elev[li + 1] - y0) : r.h;
      for (let k = 0; k < C.length; k++) {
        const p0 = C[k], p1 = C[(k + 1) % C.length];
        const len = Math.hypot(p1.x - p0.x, p1.y - p0.y); if (len < 1) continue;
        const u = { x: (p1.x - p0.x) / len, y: (p1.y - p0.y) / len };
        let n = { x: -u.y, y: u.x }; // vers l'intérieur de la pièce
        const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
        if (!roomHas(r, mx + n.x * 2, my + n.y * 2)) n = { x: -n.x, y: -n.y };
        const ops = [];
        for (const o of openings) {
          const oc = center(o), ax = { x: Math.cos(o.rot * Math.PI / 180), y: Math.sin(o.rot * Math.PI / 180) };
          const along = (oc.x - p0.x) * u.x + (oc.y - p0.y) * u.y, across = (oc.x - p0.x) * n.x + (oc.y - p0.y) * n.y;
          if (Math.abs(across) > Math.max(25, o.d) || Math.abs(ax.x * u.x + ax.y * u.y) < .9) continue;
          const a = clamp(along - o.w / 2, 0, len), b = clamp(along + o.w / 2, 0, len);
          if (b - a < 5) continue;
          const top = Math.min(H - 5, o.type === 'door' ? (o.h || DOOR_TOP_DEFAULT) : WINDOW_TOP);
          const bottom = o.type === 'door' ? 0 : clamp(WINDOW_TOP - o.h, 0, top - 10);
          ops.push({ a, b, top, bottom, o });
        }
        ops.sort((p, q) => p.a - q.a);
        const piece = (s0, s1, h0, h1, block) => {
          if (s1 - s0 < .5 || h1 - h0 < .5) return;
          const me = withEdges(box(s1 - s0, h1 - h0, WALL_T, wallMat));
          const mid = (s0 + s1) / 2;
          const cx = p0.x + u.x * mid + n.x * WALL_T / 2, cz = p0.y + u.y * mid + n.y * WALL_T / 2;
          me.position.set(cx, y0 + (h0 + h1) / 2, cz);
          me.rotation.y = -Math.atan2(u.y, u.x);
          grp.add(me);
          if (block) blockers.push({ x: cx, z: cz, u, n, hl: (s1 - s0) / 2, ht: WALL_T / 2 });
        };
        let s = 0;
        for (const op of ops) {
          if (op.a < s) { s = Math.max(s, op.b); continue; }
          piece(s, op.a, 0, H, true);
          piece(op.a, op.b, op.top, H, false);
          if (op.bottom > 0) {
            piece(op.a, op.b, 0, op.bottom, true);
            const g = new THREE.Mesh(new THREE.PlaneGeometry(op.b - op.a, op.top - op.bottom), glassMat);
            const mid = (op.a + op.b) / 2;
            g.position.set(p0.x + u.x * mid + n.x * WALL_T / 2, y0 + (op.top + op.bottom) / 2, p0.y + u.y * mid + n.y * WALL_T / 2);
            g.rotation.y = -Math.atan2(u.y, u.x);
            grp.add(g);
          }
          s = op.b;
        }
        piece(s, len, 0, H, true);
      }
    }

    // portes : battant ouvert à 90°
    for (const o of lv.items.filter(i => i.type === 'door')) {
      const top = o.h || DOOR_TOP_DEFAULT;
      const leaves = o.double ? [[2, o.w / 2], [o.w - 2, o.w / 2]] : [[o.flip ? o.w - 2 : 2, o.w]];
      for (const [hx, lw] of leaves) {
        const leaf = withEdges(box(4, top - 2, lw - 4, mat(o.color)));
        const holder = new THREE.Group(); holder.add(leaf);
        placeLocal(holder, o, hx, -lw / 2 + 2, y0 + top / 2);
        grp.add(holder);
      }
    }

    // escaliers qui montent depuis ce niveau
    const up = layout.stairs[li];
    for (const st of up) {
      const n = st.steps || Math.max(2, Math.round(st.d / 18));
      const total = doc.levels[li + 1] ? layout.elev[li + 1] - y0 : st.h;
      const m = mat(st.color);
      for (let i = 0; i < n; i++) {
        const hTop = total * (i + 1) / n, sd = st.d / n;
        const ly = st.reverse ? sd * (i + .5) : st.d - sd * (i + .5);
        const step = withEdges(box(st.w, hTop, sd, m));
        const holder = new THREE.Group(); holder.add(step);
        placeLocal(holder, st, st.w / 2, ly, y0 + hTop / 2);
        holder.userData.item = st; step.userData.item = st;
        grp.add(holder); v3.pick.push(step);
      }
    }

    // meubles, la photo sur la face avant (le côté bas du meuble sur le plan)
    for (const f of lv.items.filter(i => i.type === 'furniture')) {
      const side = mat(f.color);
      const front = f.photo ? new THREE.MeshStandardMaterial({ map: tex(f.photo), roughness: .8 }) : side;
      const me = new THREE.Mesh(new THREE.BoxGeometry(Math.max(f.w, 1), Math.max(f.h, 1), Math.max(f.d, 1)), [side, side, side, side, front, side]);
      me.castShadow = me.receiveShadow = true;
      withEdges(me);
      const holder = new THREE.Group(); holder.add(me);
      placeLocal(holder, f, f.w / 2, f.d / 2, y0 + f.h / 2);
      me.userData.item = f;
      grp.add(holder); v3.pick.push(me);
    }

    v3.blockers[li] = blockers;
    v3.levelGroups.push(grp);
    scene.add(grp);
  });

  if (!isFinite(minx)) { minx = -300; maxx = 300; minz = -300; maxz = 300; }
  const cx = (minx + maxx) / 2, cz = (minz + maxz) / 2, size = Math.max(maxx - minx, maxz - minz, 300);
  v3.bounds = { cx, cz, size };
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(size * 40, size * 40), mat(mixHex(css.getPropertyValue('--bg').trim() || '#E7EBE8', '#7d8f74', .25)));
  ground.rotation.x = -Math.PI / 2; ground.position.set(cx, -1, cz); ground.receiveShadow = true;
  scene.add(ground);

  sun.position.set(cx + size * .6, size * 1.4, cz + size * .9);
  sun.target.position.set(cx, 0, cz);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera; sc.left = sc.bottom = -size; sc.right = sc.top = size; sc.near = 10; sc.far = size * 5;
  sun.shadow.bias = -0.0005;
  return scene;
}

function disposeScene(scene) {
  if (!scene) return;
  scene.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of ms) { if (m.map) m.map.dispose(); m.dispose(); }
  });
}

function v3Resize() {
  if (!v3.renderer) return;
  const st = $('#v3Stage'), w = st.clientWidth, h = st.clientHeight;
  v3.renderer.setSize(w, h, false);
  v3.cam.aspect = w / Math.max(1, h); v3.cam.updateProjectionMatrix();
}

async function open3D() {
  closeMenus();
  $('#v3d').hidden = false; v3.open = true;
  $('#v3Msg').hidden = false; $('#v3Msg').textContent = 'Chargement de la 3D…';
  try { await ensureThree(); }
  catch (e) { $('#v3Msg').textContent = 'La 3D n\'a pas pu se charger. Vérifiez la connexion Internet puis réessayez.'; return; }
  if (!v3.open) return;
  $('#v3Msg').hidden = true;
  if (!v3.renderer) {
    v3.renderer = new THREE.WebGLRenderer({ antialias: true });
    v3.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    v3.renderer.outputEncoding = THREE.sRGBEncoding;
    v3.renderer.shadowMap.enabled = true;
    v3.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    $('#v3Stage').prepend(v3.renderer.domElement);
    v3.cam = new THREE.PerspectiveCamera(60, 1, 5, 200000);
    v3.cam.rotation.order = 'YXZ';
    v3.orbit = new THREE.OrbitControls(v3.cam, v3.renderer.domElement);
    v3.orbit.enableDamping = true; v3.orbit.maxPolarAngle = Math.PI / 2 - .05;
    bind3DInput(v3.renderer.domElement);
    new ResizeObserver(v3Resize).observe($('#v3Stage'));
  }
  disposeScene(v3.scene);
  v3.scene = buildScene();
  v3Resize();
  // départ : pièce sélectionnée, sinon pièce au centre de l'écran, sinon première pièce
  const li = doc.levels.indexOf(level());
  const rooms = items().filter(i => i.type === 'room');
  const vc = viewCenterWorld();
  const sel = selected();
  const startRoom = (sel && sel.type === 'room' && sel) || rooms.find(r => inRect(r, vc.x, vc.y)) || rooms[0];
  const sp = sel && sel.type !== 'room' ? center(sel) : startRoom ? center(startRoom) : vc;
  let yaw = Math.PI;
  if (sel && sel.type === 'stairs') { // face au sens de la montée
    const a = sel.rot * Math.PI / 180, dir = sel.reverse ? 1 : -1, fx = -Math.sin(a) * dir, fz = Math.cos(a) * dir;
    yaw = Math.atan2(-fx, -fz);
  }
  Object.assign(v3.walk, { x: sp.x, z: sp.y, lv: li, y: 0, yaw, pitch: -.05 });
  setMode3D(v3.mode);
  v3.last = performance.now();
  cancelAnimationFrame(v3.raf);
  v3.raf = requestAnimationFrame(tick3D);
}

function close3D() {
  v3.open = false; $('#v3d').hidden = true;
  cancelAnimationFrame(v3.raf); v3.keys.clear(); v3.joy = v3.look = null;
  $('#joy').hidden = true; $('#card3d').hidden = true;
}

function setMode3D(mode) {
  v3.mode = mode;
  $('#m3Over').setAttribute('aria-pressed', mode === 'over');
  $('#m3Walk').setAttribute('aria-pressed', mode === 'walk');
  $('#card3d').hidden = true;
  const touch = matchMedia('(pointer: coarse)').matches;
  if (mode === 'over') {
    v3.orbit.enabled = true;
    const li = doc.levels.indexOf(level());
    v3.levelGroups.forEach((g, i) => { g.visible = i <= li; });
    const { cx, cz, size } = v3.bounds, y = v3.layout.elev[li];
    v3.cam.fov = 45; v3.cam.updateProjectionMatrix();
    v3.orbit.target.set(cx, y + 80, cz);
    const k = Math.max(1, 1.3 / v3.cam.aspect); // recule davantage sur un écran en hauteur
    v3.cam.position.set(cx + size * .55 * k, y + size * 1.05 * k, cz + size * 1.0 * k);
    v3.orbit.update();
    $('#v3Help').textContent = touch
      ? 'Un doigt pour tourner, deux pour zoomer. Touchez un meuble pour le voir, puis « Se promener » pour entrer.'
      : 'Glisser pour tourner, molette pour zoomer, clic droit pour décaler. Cliquez un meuble pour le voir, double-cliquez le sol pour vous y promener.';
  } else {
    v3.orbit.enabled = false;
    v3.levelGroups.forEach(g => { g.visible = true; });
    v3.cam.fov = 70; v3.cam.updateProjectionMatrix();
    $('#v3Help').textContent = touch
      ? 'Pouce gauche : avancer. Glisser à droite : regarder autour. Les escaliers mènent à l\'étage.'
      : 'Z Q S D ou flèches pour marcher (Maj pour courir), glisser la souris pour regarder. Les escaliers mènent à l\'étage.';
  }
  $('#v3Help').hidden = false;
  updateWhere();
}
function updateWhere() {
  if (v3.mode === 'over') { $('#v3Where').textContent = `${level().name} et dessous`; return; }
  const lv = doc.levels[v3.walk.lv], room = lv && lv.items.find(r => r.type === 'room' && inRect(r, v3.walk.x, v3.walk.z));
  $('#v3Where').textContent = `${lv ? lv.name : ''}${room ? ' · ' + room.name : ''}`;
}

function floorY() {
  const w = v3.walk, L = v3.layout;
  // en montant depuis le niveau courant
  for (const st of L.stairs[w.lv] || []) {
    const p = stairProgress(st, w.x, w.z); if (p === null) continue;
    const top = doc.levels[w.lv + 1] ? L.elev[w.lv + 1] - L.elev[w.lv] : st.h;
    if (p > .97 && doc.levels[w.lv + 1]) { w.lv++; return L.elev[w.lv]; }
    return L.elev[w.lv] + p * top;
  }
  // en redescendant vers le niveau inférieur
  if (w.lv > 0) for (const st of L.stairs[w.lv - 1]) {
    const p = stairProgress(st, w.x, w.z); if (p === null || p > .97) continue;
    w.lv--;
    return L.elev[w.lv] + p * (L.elev[w.lv + 1] - L.elev[w.lv]);
  }
  return L.elev[w.lv];
}
function blocked(x, z) {
  for (const b of v3.blockers[v3.walk.lv] || []) {
    const dx = x - b.x, dz = z - b.z;
    if (Math.abs(dx * b.u.x + dz * b.u.y) < b.hl + RADIUS && Math.abs(dx * b.n.x + dz * b.n.y) < b.ht + RADIUS) return true;
  }
  return false;
}

function tick3D(now) {
  if (!v3.open) return;
  const dt = Math.min(.1, (now - v3.last) / 1000); v3.last = now;
  if (v3.mode === 'walk') {
    const w = v3.walk, k = v3.keys;
    let fwd = (k.has('KeyW') || k.has('ArrowUp') ? 1 : 0) - (k.has('KeyS') || k.has('ArrowDown') ? 1 : 0);
    let str = (k.has('KeyD') ? 1 : 0) - (k.has('KeyA') ? 1 : 0);
    const turn = (k.has('ArrowLeft') ? 1 : 0) - (k.has('ArrowRight') ? 1 : 0);
    w.yaw += turn * 1.8 * dt;
    if (v3.joy) { fwd = -v3.joy.vy; str = v3.joy.vx; }
    const speed = (k.has('ShiftLeft') || k.has('ShiftRight') ? 300 : 150) * dt;
    if (fwd || str) {
      const sin = Math.sin(w.yaw), cos = Math.cos(w.yaw);
      // la caméra regarde vers -Z quand yaw = 0
      const mx = (-sin * fwd + cos * str) * speed, mz = (-cos * fwd - sin * str) * speed;
      if (!blocked(w.x + mx, w.z + mz)) { w.x += mx; w.z += mz; }
      else if (!blocked(w.x + mx, w.z)) w.x += mx;
      else if (!blocked(w.x, w.z + mz)) w.z += mz;
    }
    const target = floorY() + EYE;
    w.y = w.y ? w.y + (target - w.y) * Math.min(1, dt * 12) : target;
    v3.cam.position.set(w.x, w.y, w.z);
    v3.cam.rotation.set(w.pitch, w.yaw, 0);
    if (fwd || str) updateWhere();
  } else v3.orbit.update();
  v3.renderer.render(v3.scene, v3.cam);
  v3.raf = requestAnimationFrame(tick3D);
}

function raycast(e, list) {
  const r = v3.renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(m, v3.cam);
  return rc.intersectObjects(list, true).filter(h => h.object.visible && (function vis(o) { return !o || (o.visible && vis(o.parent)); })(h.object));
}
function showCard(it) {
  const c = $('#card3d');

  c.innerHTML = `${it.photo ? `<img src="${it.photo}" alt="Photo de ${esc(it.name)}">` : ''}
    <b>${esc(it.name)}</b>
    <div class="facts"><span>L <b>${fmt(it.w)}</b></span><span>P <b>${fmt(it.d)}</b></span><span>H <b>${fmt(it.h)}</b> cm</span></div>
    ${it.notes ? `<div class="empty">${esc(it.notes)}</div>` : ''}
    <div class="actions"><button class="btn" data-edit3d="${it.id}">Modifier sur le plan</button><button class="btn ghost" data-close3dcard>Fermer</button></div>`;

}
$('#card3d').addEventListener('click', e => {
  if (e.target.closest('[data-close3dcard]')) { $('#card3d').hidden = true; return; }
  const b = e.target.closest('[data-edit3d]'); if (!b) return;

function bind3DInput(cv) {
  cv.addEventListener('pointerdown', e => {
    v3.down = { x: e.clientX, y: e.clientY, t: performance.now() };
    $('#v3Help').hidden = true;
    if (v3.mode !== 'walk') return;
    cv.setPointerCapture(e.pointerId);
    const r = cv.getBoundingClientRect();
    if (e.pointerType === 'touch' && e.clientX - r.left < r.width * .45 && !v3.joy) {
      v3.joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, vx: 0, vy: 0 };
      const j = $('#joy'); j.style.left = (e.clientX - r.left) + 'px'; j.style.top = (e.clientY - r.top) + 'px'; j.hidden = false;
      j.firstElementChild.style.transform = '';
    } else if (!v3.look) v3.look = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointermove', e => {
    if (v3.mode !== 'walk') return;
    if (v3.joy && e.pointerId === v3.joy.id) {
      let dx = e.clientX - v3.joy.ox, dy = e.clientY - v3.joy.oy; const d = Math.hypot(dx, dy), max = 50;
      if (d > max) { dx *= max / d; dy *= max / d; }
      v3.joy.vx = dx / max; v3.joy.vy = dy / max;
      $('#joy').firstElementChild.style.transform = `translate(${dx}px, ${dy}px)`;
    } else if (v3.look && e.pointerId === v3.look.id) {
      const k = e.pointerType === 'touch' ? .006 : .004;
      v3.walk.yaw += (e.clientX - v3.look.x) * k;
      v3.walk.pitch = clamp(v3.walk.pitch + (e.clientY - v3.look.y) * k, -1.3, 1.3);
      v3.look.x = e.clientX; v3.look.y = e.clientY;
    }
  });
  const up = e => {
    if (v3.joy && e.pointerId === v3.joy.id) { v3.joy = null; $('#joy').hidden = true; }
    if (v3.look && e.pointerId === v3.look.id) v3.look = null;
    const d = v3.down; v3.down = null;
    if (e.type !== 'pointerup' || !d || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6 || performance.now() - d.t > 400) return;
    const hit = raycast(e, v3.pick)[0];
    showCard(hit ? (hit.object.userData.item || hit.object.parent.userData.item) : null);
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('dblclick', e => {
    if (v3.mode !== 'over') return;
    const hit = raycast(e, v3.levelGroups.filter(g => g.visible))[0];
    if (!hit) return;
    const g = (function grp(o) { return o.userData.li !== undefined ? o : grp(o.parent); })(hit.object);
    Object.assign(v3.walk, { x: hit.point.x, z: hit.point.z, lv: g.userData.li, y: 0, pitch: -.05 });
    // regarder vers le centre de la maison
    v3.walk.yaw = Math.atan2(-(v3.bounds.cx - hit.point.x), -(v3.bounds.cz - hit.point.z));
    setMode3D('walk');
  });
}

window.addEventListener('keydown', e => {
  if (!v3.open || e.target.closest('input, textarea, select')) return;
  if (e.key === 'Escape') { close3D(); return; }
  if (v3.mode === 'walk') { v3.keys.add(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); }
});
window.addEventListener('keyup', e => v3.keys.delete(e.code));
window.addEventListener('blur', () => v3.keys.clear());
$('#open3d').addEventListener('click', open3D);
$('#v3Close').addEventListener('click', close3D);
$('#m3Over').addEventListener('click', () => setMode3D('over'));
$('#m3Walk').addEventListener('click', () => { v3.walk.y = 0; setMode3D('walk'); });

/* =========================================================
   Démarrage
   ========================================================= */
(async () => {
  $('#snapSel').value = String(opts.snap);
  $('#optCarry').checked = opts.carry; $('#optGhost').checked = opts.ghost; $('#optDims').checked = opts.dims;
  try {
    const saved = await dbGet('doc');
    if (saved && Array.isArray(saved.levels) && saved.levels.length) { doc = saved; setStatus('Plan rechargé'); }
  } catch (e) { setStatus('Stockage indisponible : rien ne sera conservé'); }
  if (!doc) { doc = sampleDoc(); if ($('#status').textContent === '—') setStatus('Plan d\'exemple'); }
  if (window.matchMedia('(max-width: 760px)').matches) aside.classList.add('collapsed');
  renderLevels(); renderGhost(); renderPanel(); updateUndoButtons();
  requestAnimationFrame(fit);
})();
})();
</script>
</body>
